<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diagramm Digitalisierer Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #e4e4e7;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background: #27272a;
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      border-bottom: 1px solid #3f3f46;
      z-index: 20;
      flex-shrink: 0;
    }
    
    button, .file-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      touch-action: manipulation;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      white-space: nowrap;
    }
    button.active-mode {
      background: #f59e0b !important;
      color: #000 !important;
      font-weight: 700;
    }
    button:disabled { background: #52525b; cursor: not-allowed; opacity: 0.6; }

    .visually-hidden-input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    #main-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background: #09090b;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    canvas {
      cursor: crosshair;
      touch-action: none; /* Wichtig für eigene Pointer/Gestensteuerung */
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      background: #18181b;
    }

    #sidebar {
      width: 320px;
      max-width: 100%;
      background: #27272a;
      padding: 10px;
      overflow-y: auto;
      border-left: 1px solid #3f3f46;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .panel {
      background: #18181b;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      flex-shrink: 0;
    }
    .panel h3 { font-size: 13px; margin-bottom: 6px; color: #60a5fa; }
    .status-msg { font-size: 12px; color: #a1a1aa; line-height: 1.3; }

    .calib-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 6px;
    }
    .calib-target-btn {
      background: #3f3f46;
      font-size: 11px;
      padding: 4px;
      border-radius: 4px;
    }
    .calib-target-btn.active-target {
      background: #3b82f6;
      color: #fff;
      font-weight: bold;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      font-size: 11px;
      color: #a1a1aa;
    }
    .input-group input {
      margin-top: 2px;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: white;
      text-align: right;
    }

    /* Steuerkreuz */
    #nudge-pad {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(24, 24, 27, 0.9);
      border: 1px solid #52525b;
      border-radius: 12px;
      width: 115px;
      height: 115px;
      backdrop-filter: blur(4px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 4px;
      gap: 3px;
      z-index: 10;
    }
    .nudge-btn {
      background: #3f3f46;
      color: white;
      border: none;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      padding: 0;
      cursor: pointer;
    }
    .nudge-btn:active { background: #60a5fa; }
    .nudge-step-btn {
      background: #27272a;
      border: 1px solid #60a5fa;
      color: #60a5fa;
      font-weight: bold;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Tabelle */
    .table-wrap {
      flex: 1;
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      margin-top: 6px;
    }
    table { width: 100%; font-size: 11px; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #27272a; padding: 4px 6px; text-align: right; user-select: none; }
    th { background: #27272a; position: sticky; top: 0; }
    tr.selected-row { background: #3b82f6 !important; color: white; }
    tbody tr { cursor: pointer; }
    tbody tr:hover:not(.selected-row) { background: #222228; }

    @media (max-width: 850px) {
      #main-container { flex-direction: column; }
      #sidebar { width: 100%; height: 260px; border-left: none; border-top: 1px solid #3f3f46; }
      #nudge-pad { bottom: 8px; left: 8px; width: 95px; height: 95px; }
    }
  </style>
</head>
<body>

  <header>
    <label class="file-btn" for="fileInput" style="background:#2563eb;">📁 Bild laden</label>
    <input type="file" id="fileInput" class="visually-hidden-input" accept="image/*" onclick="this.value = null;">
    
    <button id="modeAlignBtn" onclick="setMode('align')">📐 1. Ausrichten</button>
    <button id="btnWarp" style="background:#10b981;" onclick="applyPerspectiveWarp()">🪄 2. Geraderücken</button>
    <button id="btnUndoWarp" style="background:#64748b;" onclick="undoPerspectiveWarp()" disabled>↩️ Entzerren rückgängig</button>
    
    <button id="modeCalibBtn" onclick="setMode('calib')">🎯 3. Kalibrieren</button>
    <button id="modeDataBtn" onclick="setMode('data')">📈 4. Punkte erfassen</button>
    
    <div style="display:flex; gap:4px; margin-left:auto;">
      <button id="modeZoomBtn" onclick="setMode('zoom')" style="background:#0284c7;">🔍 Rechteck-Zoom</button>
      <button onclick="resetZoom()" style="background:#4b5563;">🖼️ Vollansicht</button>
      <button id="btnExport" style="background:#8b5cf6;" onclick="exportCSV()">CSV</button>
    </div>
  </header>

  <div id="main-container">
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
      
      <div id="nudge-pad">
        <div></div>
        <button class="nudge-btn" onclick="nudge(0, -1)">▲</button>
        <div></div>
        <button class="nudge-btn" onclick="nudge(-1, 0)">◀</button>
        <button class="nudge-step-btn" id="stepToggleBtn" onclick="toggleStepSize()">1px</button>
        <button class="nudge-btn" onclick="nudge(1, 0)">▶</button>
        <div></div>
        <button class="nudge-btn" onclick="nudge(0, 1)">▼</button>
        <div></div>
      </div>
    </div>

    <div id="sidebar">
      <div class="panel">
        <h3 id="panel-title">Modus: 1. Ausrichten</h3>
        <p class="status-msg" id="status-desc">Lade ein Bild, um zu beginnen.</p>
        <p class="status-msg" style="margin-top:4px; font-size:11px; color:#71717a;">💡 2-Finger-Geste = Zoom & Pan. Desktop: Mausrad & rechte Maustaste.</p>
      </div>

      <div class="panel">
        <h3>3. Achsen-Kalibrierung</h3>
        <div class="calib-btn-grid">
          <button class="calib-target-btn" id="btn-target-x1" onclick="setCalibTarget('x1')">X-Min (P1)</button>
          <button class="calib-target-btn" id="btn-target-x2" onclick="setCalibTarget('x2')">X-Max (P2)</button>
          <button class="calib-target-btn" id="btn-target-y1" onclick="setCalibTarget('y1')">Y-Min (P3)</button>
          <button class="calib-target-btn" id="btn-target-y2" onclick="setCalibTarget('y2')">Y-Max (P4)</button>
        </div>
        <div class="input-grid">
          <div class="input-group">
            <label>X-Min Wert</label>
            <input type="number" id="xMinVal" value="0" oninput="updateTable()">
          </div>
          <div class="input-group">
            <label>X-Max Wert</label>
            <input type="number" id="xMaxVal" value="100" oninput="updateTable()">
          </div>
          <div class="input-group">
            <label>Y-Min Wert</label>
            <input type="number" id="yMinVal" value="0" oninput="updateTable()">
          </div>
          <div class="input-group">
            <label>Y-Max Wert</label>
            <input type="number" id="yMaxVal" value="10">
          </div>
        </div>
      </div>

      <div class="panel" style="flex:1; display:flex; flex-direction:column; min-height:160px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3>4. Datenpunkte</h3>
          <div style="display:flex; gap:4px;">
            <button style="background:#e11d48; padding:3px 6px; font-size:10px;" onclick="deleteSelectedPoints()">Gewählte löschen</button>
            <button style="background:#52525b; padding:3px 6px; font-size:10px;" onclick="clearDataPoints()">Alle leeren</button>
          </div>
        </div>
        <p style="font-size:10px; color:#a1a1aa; margin-top:2px;">Klick = Auswählen | Strg/Shift = Mehrfachauswahl</p>
        <div class="table-wrap">
          <table id="dataTable">
            <thead>
              <tr><th>#</th><th>X</th><th>Y</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const fileInput = document.getElementById('fileInput');

    let rawImage = null;
    let currentImage = null;
    let currentMode = 'align';
    let activePointRef = null;
    let stepSize = 1;

    // Viewport & Pan
    let view = { x: 0, y: 0, w: 0, h: 0 };
    let isPanningMouse = false;
    let panStartMouse = { x: 0, y: 0 };
    let zoomDragStart = null;
    let currentDragPos = null;

    // Multi-Touch Geste State
    const activePointers = new Map();
    let initialPinchDist = null;
    let initialPinchCenter = null;
    let initialPinchView = null;
    let isTouchGesturing = false;
    let singleTouchStart = null;

    let alignCorners = [];
    let previousAlignCorners = [];

    let calibPoints = { x1: null, x2: null, y1: null, y2: null };
    let calibTarget = 'x1';

    let dataPoints = [];
    let selectedIndices = new Set();
    let lastSelectedIndex = null;

    const MAX_DIMENSION = 1800;

    fileInput.addEventListener('change', function(e) {
      const file = this.files && this.files[0];
      if (!file) return;

      const blobUrl = URL.createObjectURL(file);
      const tempImg = new Image();

      tempImg.onload = function() {
        let w = tempImg.width || tempImg.naturalWidth;
        let h = tempImg.height || tempImg.naturalHeight;

        if (w > MAX_DIMENSION || h > MAX_DIMENSION) {
          const scale = Math.min(MAX_DIMENSION / w, MAX_DIMENSION / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }

        const off = document.createElement('canvas');
        off.width = w;
        off.height = h;
        off.getContext('2d').drawImage(tempImg, 0, 0, w, h);
        URL.revokeObjectURL(blobUrl);

        rawImage = off;
        currentImage = off;

        document.getElementById('btnUndoWarp').disabled = true;
        alignCorners = [];
        calibPoints = { x1: null, x2: null, y1: null, y2: null };
        dataPoints = [];
        selectedIndices.clear();
        updateTable();
        
        resetZoom();
        setMode('align');
      };
      tempImg.src = blobUrl;
    });

    function resetZoom() {
      if (!currentImage) return;
      view = { x: 0, y: 0, w: currentImage.width, h: currentImage.height };
      resizeCanvasToFit();
      redraw();
    }

    function resizeCanvasToFit() {
      if (!currentImage) return;
      const cWidth = Math.max(container.clientWidth - 10, 100);
      const cHeight = Math.max(container.clientHeight - 10, 100);
      const scale = Math.min(cWidth / view.w, cHeight / view.h);
      canvas.width = Math.max(Math.round(view.w * scale), 10);
      canvas.height = Math.max(Math.round(view.h * scale), 10);
    }

    window.addEventListener('resize', () => {
      if (currentImage) {
        resizeCanvasToFit();
        redraw();
      }
    });

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeZoomBtn').classList.toggle('active-mode', mode === 'zoom');
      document.getElementById('modeAlignBtn').classList.toggle('active-mode', mode === 'align');
      document.getElementById('modeCalibBtn').classList.toggle('active-mode', mode === 'calib');
      document.getElementById('modeDataBtn').classList.toggle('active-mode', mode === 'data');

      const title = document.getElementById('panel-title');
      const desc = document.getElementById('status-desc');

      if (!currentImage) {
        title.innerText = 'Kein Bild';
        desc.innerText = 'Bitte zuerst ein Diagramm laden.';
        return;
      }

      if (mode === 'align') {
        title.innerText = 'Modus: 1. Ausrichten';
        desc.innerText = 'Setze 4 Eckpunkte (TL, TR, BR, BL) und klicke auf "2. Geraderücken".';
      } else if (mode === 'calib') {
        title.innerText = 'Modus: 3. Kalibrieren';
        desc.innerText = 'Wähle einen Punkt (X-Min/Max, Y-Min/Max), klicke ins Bild oder verschiebe ihn.';
        updateCalibButtonHighlight();
      } else if (mode === 'data') {
        title.innerText = 'Modus: 4. Punkte erfassen';
        desc.innerText = 'Klicke Punkte an. Klick auf vorhandene Punkte wählt diese zum Löschen/Verschieben.';
      } else if (mode === 'zoom') {
        title.innerText = 'Modus: 🔍 Rechteck-Zoom';
        desc.innerText = 'Ziehe ein Rechteck über den Bereich, den du vergrößern möchtest.';
      }
      redraw();
    }

    function setCalibTarget(target) {
      calibTarget = target;
      setMode('calib');
      activePointRef = calibPoints[target];
      updateCalibButtonHighlight();
      redraw();
    }

    function updateCalibButtonHighlight() {
      ['x1', 'x2', 'y1', 'y2'].forEach(key => {
        const btn = document.getElementById(`btn-target-${key}`);
        if (btn) btn.classList.toggle('active-target', currentMode === 'calib' && calibTarget === key);
      });
    }

    window.toggleStepSize = function() {
      stepSize = (stepSize === 1) ? 10 : 1;
      document.getElementById('stepToggleBtn').innerText = `${stepSize}px`;
    };

    // Mausrad Zoom
    container.addEventListener('wheel', (e) => {
      if (!currentImage) return;
      e.preventDefault();

      const imgPt = canvasToImageCoords(e.clientX, e.clientY);
      const zoomFactor = e.deltaY < 0 ? 0.85 : 1.15;

      const newW = Math.max(20, Math.min(currentImage.width * 2, view.w * zoomFactor));
      const newH = Math.max(20, Math.min(currentImage.height * 2, view.h * zoomFactor));

      const relX = (imgPt.x - view.x) / view.w;
      const relY = (imgPt.y - view.y) / view.h;

      view.x = imgPt.x - relX * newW;
      view.y = imgPt.y - relY * newH;
      view.w = newW;
      view.h = newH;

      clampView();
      resizeCanvasToFit();
      redraw();
    }, { passive: false });

    function clampView() {
      if (!currentImage) return;
      view.w = Math.min(view.w, currentImage.width);
      view.h = Math.min(view.h, currentImage.height);
      view.x = Math.max(0, Math.min(currentImage.width - view.w, view.x));
      view.y = Math.max(0, Math.min(currentImage.height - view.h, view.y));
    }

    // Tastatursteuerung
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selectedIndices.size > 0 && currentMode === 'data') {
          deleteSelectedPoints();
          e.preventDefault();
        }
      }
      if (!activePointRef) return;
      let mult = e.shiftKey ? 10 : stepSize;
      if (e.key === 'ArrowUp') { nudge(0, -1, mult); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { nudge(0, 1, mult); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { nudge(-1, 0, mult); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { nudge(1, 0, mult); e.preventDefault(); }
    });

    function canvasToImageCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const relX = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
      const relY = Math.min(Math.max((clientY - rect.top) / rect.height, 0), 1);
      return { x: view.x + relX * view.w, y: view.y + relY * view.h };
    }

    function imageToCanvasCoords(pt) {
      return {
        x: ((pt.x - view.x) / view.w) * canvas.width,
        y: ((pt.y - view.y) / view.h) * canvas.height
      };
    }

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // -------------------------------------------------------------
    // GESTEN- & POINTER-STEUERUNG (TOUCH & MAUS)
    // -------------------------------------------------------------

    canvas.addEventListener('pointerdown', (e) => {
      if (!currentImage) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      // Maus: Pan mit Rechtsklick
      if (e.pointerType === 'mouse' && (e.button === 2 || e.button === 1)) {
        isPanningMouse = true;
        panStartMouse = { x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
        return;
      }

      // Touch: 2 Finger erkannt -> Sofort Pinch-to-Zoom initialisieren
      if (activePointers.size === 2) {
        isTouchGesturing = true;
        const pts = Array.from(activePointers.values());
        initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        initialPinchCenter = {
          x: (pts[0].x + pts[1].x) / 2,
          y: (pts[0].y + pts[1].y) / 2
        };
        initialPinchView = { ...view };
        return;
      }

      // Einzelfinger / Linksklick Start
      if (activePointers.size === 1) {
        const imgPt = canvasToImageCoords(e.clientX, e.clientY);
        singleTouchStart = { clientX: e.clientX, clientY: e.clientY, imgPt };

        if (currentMode === 'zoom') {
          zoomDragStart = imgPt;
          currentDragPos = imgPt;
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!currentImage || !activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      // Maus Pan
      if (isPanningMouse) {
        const dx = (e.clientX - panStartMouse.x) * (view.w / canvas.width);
        const dy = (e.clientY - panStartMouse.y) * (view.h / canvas.height);
        view.x -= dx;
        view.y -= dy;
        clampView();
        panStartMouse = { x: e.clientX, y: e.clientY };
        redraw();
        return;
      }

      // Touch: 2-Finger Zoom & Pan
      if (activePointers.size === 2 && isTouchGesturing && initialPinchDist && initialPinchCenter && initialPinchView) {
        const pts = Array.from(activePointers.values());
        const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const currentCenter = {
          x: (pts[0].x + pts[1].x) / 2,
          y: (pts[0].y + pts[1].y) / 2
        };

        const scale = initialPinchDist / Math.max(currentDist, 10);
        let newW = initialPinchView.w * scale;
        let newH = initialPinchView.h * scale;

        newW = Math.max(20, Math.min(currentImage.width, newW));
        newH = Math.max(20, Math.min(currentImage.height, newH));

        // Bild-Mittelpunkt bei Gestenstart
        const rect = canvas.getBoundingClientRect();
        const relCenterX = (initialPinchCenter.x - rect.left) / rect.width;
        const relCenterY = (initialPinchCenter.y - rect.top) / rect.height;
        const centerImgX = initialPinchView.x + relCenterX * initialPinchView.w;
        const centerImgY = initialPinchView.y + relCenterY * initialPinchView.h;

        // Verschiebung des Mittelpunkts (Pan)
        const panDeltaX = (currentCenter.x - initialPinchCenter.x) * (newW / canvas.width);
        const panDeltaY = (currentCenter.y - initialPinchCenter.y) * (newH / canvas.height);

        view.x = centerImgX - relCenterX * newW - panDeltaX;
        view.y = centerImgY -
