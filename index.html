<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diagramm Digitalisierer Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #e4e4e7;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #27272a;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      border-bottom: 1px solid #3f3f46;
      z-index: 20;
    }
    button, label.btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      touch-action: manipulation;
      user-select: none;
    }
    button.active-mode {
      background: #f59e0b !important;
      color: #000 !important;
      font-weight: 700;
    }
    button:disabled { background: #52525b; cursor: not-allowed; }
    input[type="file"] { display: none; }

    #main-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background: #09090b;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      background: #18181b;
    }

    #sidebar {
      width: 300px;
      background: #27272a;
      padding: 12px;
      overflow-y: auto;
      border-left: 1px solid #3f3f46;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel {
      background: #18181b;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
    }
    .panel h3 { font-size: 13px; margin-bottom: 6px; color: #60a5fa; }
    .status-msg { font-size: 12px; color: #a1a1aa; margin-bottom: 4px; line-height: 1.3; }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      font-size: 11px;
      color: #a1a1aa;
    }
    .input-group input {
      margin-top: 2px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: white;
      text-align: right;
    }

    /* Steuerkreuz */
    #nudge-pad {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(24, 24, 27, 0.9);
      border: 1px solid #52525b;
      border-radius: 12px;
      width: 120px;
      height: 120px;
      backdrop-filter: blur(4px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 4px;
      gap: 3px;
      z-index: 10;
    }
    .nudge-btn {
      background: #3f3f46;
      color: white;
      border: none;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      padding: 0;
      cursor: pointer;
    }
    .nudge-btn:active { background: #60a5fa; }
    .nudge-step-btn {
      background: #27272a;
      border: 1px solid #60a5fa;
      color: #60a5fa;
      font-weight: bold;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }

    table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 6px; }
    th, td { border: 1px solid #3f3f46; padding: 4px; text-align: right; }
    th { background: #27272a; }

    @media (max-width: 800px) {
      #main-container { flex-direction: column; }
      #sidebar { width: 100%; height: 230px; border-left: none; border-top: 1px solid #3f3f46; }
      #nudge-pad { bottom: 10px; left: 10px; width: 105px; height: 105px; }
    }
  </style>
</head>
<body>

  <header>
    <label class="btn" for="fileInput">📁 Bild</label>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    
    <button id="modeZoomBtn" onclick="setMode('zoom')" style="background:#0284c7;">🔍 Rechteck-Zoom</button>
    <button onclick="resetZoom()" style="background:#4b5563;">🖼️ Vollansicht</button>
    
    <button id="modeAlignBtn" onclick="setMode('align')">📐 1. Ausrichten</button>
    <button id="modeCalibBtn" onclick="setMode('calib')">🎯 2. Kalibrieren</button>
    <button id="modeDataBtn" onclick="setMode('data')">📈 3. Punkte</button>
    
    <button id="btnWarp" style="background:#10b981;" onclick="applyPerspectiveWarp()">Geraderücken</button>
    <button id="btnExport" style="background:#8b5cf6;" onclick="exportCSV()">CSV</button>
  </header>

  <div id="main-container">
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
      
      <div id="nudge-pad">
        <div></div>
        <button class="nudge-btn" onclick="nudge(0, -1)">▲</button>
        <div></div>
        <button class="nudge-btn" onclick="nudge(-1, 0)">◀</button>
        <button class="nudge-step-btn" id="stepToggleBtn" onclick="toggleStepSize()">1px</button>
        <button class="nudge-btn" onclick="nudge(1, 0)">▶</button>
        <div></div>
        <button class="nudge-btn" onclick="nudge(0, 1)">▼</button>
        <div></div>
      </div>
    </div>

    <div id="sidebar">
      <div class="panel">
        <h3 id="panel-title">Modus: 1. Ausrichten</h3>
        <p class="status-msg" id="status-desc">Klicke 4 Ecken: P1 (TL), P2 (TR), P3 (BR), P4 (BL).</p>
      </div>

      <div class="panel">
        <h3>Kalibrierwerte</h3>
        <div class="input-grid">
          <div class="input-group">
            <label>X-Min</label>
            <input type="number" id="xMinVal" value="0">
          </div>
          <div class="input-group">
            <label>X-Max</label>
            <input type="number" id="xMaxVal" value="100">
          </div>
          <div class="input-group">
            <label>Y-Min</label>
            <input type="number" id="yMinVal" value="0">
          </div>
          <div class="input-group">
            <label>Y-Max</label>
            <input type="number" id="yMaxVal" value="10">
          </div>
        </div>
      </div>

      <div class="panel" style="flex:1; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3>Datenpunkte</h3>
          <button style="background:#ef4444; padding:2px 6px; font-size:11px;" onclick="clearDataPoints()">Leeren</button>
        </div>
        <table id="dataTable">
          <thead>
            <tr><th>#</th><th>X</th><th>Y</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const fileInput = document.getElementById('fileInput');

    let imgElement = new Image();
    let currentMode = 'align';
    let activePointRef = null;
    let stepSize = 1;

    // Viewport & Zoom (in Bildkoordinaten)
    let view = { x: 0, y: 0, w: 0, h: 0 };
    let zoomDragStart = null;
    let currentDragPos = null;

    let alignCorners = [];
    let calibPoints = { x1: null, x2: null, y1: null, y2: null };
    let calibStep = 0;
    let dataPoints = [];

    const MAX_DIMENSION = 1600;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const tempImg = new Image();
        tempImg.onload = () => {
          let w = tempImg.width;
          let h = tempImg.height;

          if (w > MAX_DIMENSION || h > MAX_DIMENSION) {
            const scale = Math.min(MAX_DIMENSION / w, MAX_DIMENSION / h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }

          const offCanvas = document.createElement('canvas');
          offCanvas.width = w;
          offCanvas.height = h;
          offCanvas.getContext('2d').drawImage(tempImg, 0, 0, w, h);

          imgElement = new Image();
          imgElement.onload = () => {
            alignCorners = [];
            calibPoints = { x1: null, x2: null, y1: null, y2: null };
            dataPoints = [];
            updateTable();
            resetZoom();
            setMode('align');
          };
          imgElement.src = offCanvas.toDataURL('image/jpeg', 0.92);
        };
        tempImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function resetZoom() {
      if (!imgElement.src) return;
      view = { x: 0, y: 0, w: imgElement.width, h: imgElement.height };
      resizeCanvasToFit();
      redraw();
    }

    function resizeCanvasToFit() {
      if (!imgElement.src) return;
      const cWidth = container.clientWidth - 20;
      const cHeight = container.clientHeight - 20;
      const scale = Math.min(cWidth / view.w, cHeight / view.h);
      canvas.width = Math.round(view.w * scale);
      canvas.height = Math.round(view.h * scale);
    }

    window.addEventListener('resize', () => {
      resizeCanvasToFit();
      redraw();
    });

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeZoomBtn').classList.toggle('active-mode', mode === 'zoom');
      document.getElementById('modeAlignBtn').classList.toggle('active-mode', mode === 'align');
      document.getElementById('modeCalibBtn').classList.toggle('active-mode', mode === 'calib');
      document.getElementById('modeDataBtn').classList.toggle('active-mode', mode === 'data');

      const title = document.getElementById('panel-title');
      const desc = document.getElementById('status-desc');

      if (mode === 'zoom') {
        title.innerText = 'Modus: 🔍 Rechteck-Zoom';
        desc.innerText = 'Ziehe mit der Maus/Touch ein Rechteck über den Bereich, den du vergrößern möchtest.';
      } else if (mode === 'align') {
        title.innerText = 'Modus: 1. Ausrichten';
        desc.innerText = 'Klicke nacheinander auf: P1 (TL), P2 (TR), P3 (BR), P4 (BL).';
      } else if (mode === 'calib') {
        title.innerText = 'Modus: 2. Kalibrieren';
        calibStep = 0;
        desc.innerText = 'Klicke nacheinander: 1. X-Min, 2. X-Max, 3. Y-Min, 4. Y-Max.';
      } else if (mode === 'data') {
        title.innerText = 'Modus: 3. Datenpunkte';
        desc.innerText = 'Klicke Datenpunkte an. Justiere mit Pfeilkreuz oder Tastatur.';
      }
      redraw();
    }

    window.toggleStepSize = function() {
      stepSize = (stepSize === 1) ? 10 : 1;
      document.getElementById('stepToggleBtn').innerText = `${stepSize}px`;
    };

    window.addEventListener('keydown', (e) => {
      if (!activePointRef) return;
      let mult = e.shiftKey ? 10 : stepSize;
      if (e.key === 'ArrowUp') { nudge(0, -1, mult); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { nudge(0, 1, mult); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { nudge(-1, 0, mult); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { nudge(1, 0, mult); e.preventDefault(); }
    });

    // Koordinaten-Umrechnung (Canvas -> Original-Bild)
    function canvasToImageCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const relX = (clientX - rect.left) / rect.width;
      const relY = (clientY - rect.top) / rect.height;
      return {
        x: view.x + relX * view.w,
        y: view.y + relY * view.h
      };
    }

    // Koordinaten-Umrechnung (Original-Bild -> Canvas Pixel)
    function imageToCanvasCoords(pt) {
      return {
        x: ((pt.x - view.x) / view.w) * canvas.width,
        y: ((pt.y - view.y) / view.h) * canvas.height
      };
    }

    // Pointer Events für Zoom & Klicks
    canvas.addEventListener('pointerdown', (e) => {
      if (!imgElement.src) return;
      const imgPt = canvasToImageCoords(e.clientX, e.clientY);

      if (currentMode === 'zoom') {
        zoomDragStart = imgPt;
        currentDragPos = imgPt;
        canvas.setPointerCapture(e.pointerId);
        return;
      }

      // Klickaktionen für die anderen Modi
      if (currentMode === 'align') {
        let closest = null;
        let minDist = (30 / canvas.width) * view.w;
        alignCorners.forEach(c => {
          const d = Math.hypot(c.x - imgPt.x, c.y - imgPt.y);
          if (d < minDist) { minDist = d; closest = c; }
        });

        if (closest) {
          activePointRef = closest;
        } else if (alignCorners.length < 4) {
          alignCorners.push(imgPt);
          activePointRef = imgPt;
          const names = ['P2 (TR)', 'P3 (BR)', 'P4 (BL)', 'Ausrichtung komplett'];
          document.getElementById('status-desc').innerText = `Gesetzt! Nächster Punkt: ${names[alignCorners.length - 1]}`;
        } else {
          let closestAny = alignCorners[0];
          let dMin = Math.hypot(alignCorners[0].x - imgPt.x, alignCorners[0].y - imgPt.y);
          for (let i = 1; i < 4; i++) {
            const d = Math.hypot(alignCorners[i].x - imgPt.x, alignCorners[i].y - imgPt.y);
            if (d < dMin) { dMin = d; closestAny = alignCorners[i]; }
          }
          closestAny.x = imgPt.x;
          closestAny.y = imgPt.y;
          activePointRef = closestAny;
        }
      } 
      else if (currentMode === 'calib') {
        activePointRef = imgPt;
        if (calibStep === 0) {
          calibPoints.x1 = imgPt; calibStep = 1;
          document.getElementById('status-desc').innerText = 'Klicke auf X-Max.';
        } else if (calibStep === 1) {
          calibPoints.x2 = imgPt; calibStep = 2;
          document.getElementById('status-desc').innerText = 'Klicke auf Y-Min.';
        } else if (calibStep === 2) {
          calibPoints.y1 = imgPt; calibStep = 3;
          document.getElementById('status-desc').innerText = 'Klicke auf Y-Max.';
        } else if (calibStep === 3) {
          calibPoints.y2 = imgPt; calibStep = 0;
          document.getElementById('status-desc').innerText = 'Kalibriert! Wechsle zu "3. Punkte".';
        }
      } 
      else if (currentMode === 'data') {
        dataPoints.push(imgPt);
        activePointRef = imgPt;
        updateTable();
      }

      redraw();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (currentMode === 'zoom' && zoomDragStart) {
        currentDragPos = canvasToImageCoords(e.clientX, e.clientY);
        redraw();
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (currentMode === 'zoom' && zoomDragStart && currentDragPos) {
        const xMin = Math.min(zoomDragStart.x, currentDragPos.x);
        const xMax = Math.max(zoomDragStart.x, currentDragPos.x);
        const yMin = Math.min(zoomDragStart.y, currentDragPos.y);
        const yMax = Math.max(zoomDragStart.y, currentDragPos.y);

        const w = xMax - xMin;
        const h = yMax - yMin;

        // Nur zoomen wenn ein echtes Rechteck gezogen wurde
        if (w > 10 && h > 10) {
          view = {
            x: Math.max(0, xMin),
            y: Math.max(0, yMin),
            w: Math.min(imgElement.width - xMin, w),
            h: Math.min(imgElement.height - yMin, h)
          };
          resizeCanvasToFit();
        }

        zoomDragStart = null;
        currentDragPos = null;
        redraw();
      }
    });

    window.nudge = function(dx, dy, customStep) {
      if (!activePointRef) return;
      const s = customStep || stepSize;
      activePointRef.x += dx * s;
      activePointRef.y += dy * s;
      redraw();
      if (currentMode === 'data') updateTable();
    };

    function redraw() {
      if (!imgElement.src) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Zeichne aktuellen Ausschnitt des Bildes
      ctx.drawImage(
        imgElement,
        view.x, view.y, view.w, view.h,
        0, 0, canvas.width, canvas.height
      );

      // Ecken zeichnen
      if (alignCorners.length > 0) {
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const start = imageToCanvasCoords(alignCorners[0]);
        ctx.moveTo(start.x, start.y);
        for (let i = 1; i < alignCorners.length; i++) {
          const pt = imageToCanvasCoords(alignCorners[i]);
          ctx.lineTo(pt.x, pt.y);
        }
        if (alignCorners.length === 4) ctx.closePath();
        ctx.stroke();

        alignCorners.forEach((c, idx) => {
          drawMarker(c, '#f59e0b', `P${idx+1}`, c === activePointRef);
        });
      }

      // Kalibrier-Punkte
      if (calibPoints.x1) drawMarker(calibPoints.x1, '#3b82f6', 'X-Min', calibPoints.x1 === activePointRef);
      if (calibPoints.x2) drawMarker(calibPoints.x2, '#3b82f6', 'X-Max', calibPoints.x2 === activePointRef);
      if (calibPoints.y1) drawMarker(calibPoints.y1, '#10b981', 'Y-Min', calibPoints.y1 === activePointRef);
      if (calibPoints.y2) drawMarker(calibPoints.y2, '#10b981', 'Y-Max', calibPoints.y2 === activePointRef);

      // Datenpunkte
      dataPoints.forEach((p, idx) => {
        drawMarker(p, '#ef4444', `${idx+1}`, p === activePointRef);
      });

      // Zoom-Rechteck zeichnen
      if (currentMode === 'zoom' && zoomDragStart && currentDragPos) {
        const p1 = imageToCanvasCoords(zoomDragStart);
        const p2 = imageToCanvasCoords(currentDragPos);
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
        ctx.fillStyle = 'rgba(2, 132, 199, 0.15)';
        ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
        ctx.setLineDash([]);
      }
    }

    function drawMarker(imgPt, color, label, isActive) {
      const pt = imageToCanvasCoords(imgPt);
      ctx.strokeStyle = isActive ? '#ffffff' : color;
      ctx.fillStyle = color;
      ctx.lineWidth = isActive ? 3 : 2;

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, isActive ? 7 : 5, 0, 2 * Math.PI);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pt.x - 10, pt.y); ctx.lineTo(pt.x + 10, pt.y);
      ctx.moveTo(pt.x, pt.y - 10); ctx.lineTo(pt.x, pt.y + 10);
      ctx.stroke();

      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(label, pt.x + 8, pt.y - 8);
    }

    function applyPerspectiveWarp() {
      if (alignCorners.length < 4 || !imgElement.src) {
        alert('Bitte zuerst alle 4 Ecken P1 bis P4 setzen!');
        return;
      }

      const [p0, p1, p2, p3] = alignCorners; // TL, TR, BR, BL
      const w = Math.round(Math.max(Math.hypot(p1.x - p0.x, p1.y - p0.y), Math.hypot(p2.x - p3.x, p2.y - p3.y)));
      const h = Math.round(Math.max(Math.hypot(p3.x - p0.x, p3.y - p0.y), Math.hypot(p2.x - p1.x, p2.y - p1.y)));

      const offCanvas = document.createElement('canvas');
      offCanvas.width = w;
      offCanvas.height = h;
      const offCtx = offCanvas.getContext('2d');

      function mapTriangle(srcTri, dstTri) {
        offCtx.save();
        offCtx.beginPath();
        offCtx.moveTo(dstTri[0].x, dstTri[0].y);
        offCtx.lineTo(dstTri[1].x, dstTri[1].y);
        offCtx.lineTo(dstTri[2].x, dstTri[2].y);
        offCtx.closePath();
        offCtx.clip();

        const x0 = srcTri[0].x, y0 = srcTri[0].y;
        const x1 = srcTri[1].x, y1 = srcTri[1].y;
        const x2 = srcTri[2].x, y2 = srcTri[2].y;
        const u0 = dstTri[0].x, v0 = dstTri[0].y;
        const u1 = dstTri[1].x, v1 = dstTri[1].y;
        const u2 = dstTri[2].x, v2 = dstTri[2].y;

        const delta = u0 * (v1 - v2) - u1 * (v0 - v2) + u2 * (v0 - v1);
        if (delta === 0) { offCtx.restore(); return; }

        const a = (x0 * (v1 - v2) - x1 * (v0 - v2) + x2 * (v0 - v1)) / delta;
        const b = (u0 * (x1 -
