<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diagramm Digitalisierer Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #e4e4e7;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #27272a;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      border-bottom: 1px solid #3f3f46;
      z-index: 20;
    }
    button, label.btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      touch-action: manipulation;
      user-select: none;
    }
    button.active-mode {
      background: #f59e0b;
      color: #000;
      font-weight: 700;
    }
    button:disabled { background: #52525b; cursor: not-allowed; }
    input[type="file"] { display: none; }

    .zoom-controls {
      display: flex;
      gap: 4px;
      background: #18181b;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      align-items: center;
    }
    .zoom-controls span { font-size: 11px; color: #a1a1aa; min-width: 36px; text-align: center; }

    #main-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background: #09090b;
      overflow: auto; /* Erlaubt Panning bei hohem Zoom */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      background: #18181b;
      transform-origin: center center;
      transition: width 0.1s ease, height 0.1s ease;
    }

    #sidebar {
      width: 300px;
      background: #27272a;
      padding: 12px;
      overflow-y: auto;
      border-left: 1px solid #3f3f46;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel {
      background: #18181b;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
    }
    .panel h3 { font-size: 13px; margin-bottom: 6px; color: #60a5fa; }
    .status-msg { font-size: 12px; color: #a1a1aa; margin-bottom: 4px; line-height: 1.3; }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      font-size: 11px;
      color: #a1a1aa;
    }
    .input-group input {
      margin-top: 2px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: white;
      text-align: right;
    }

    /* Steuerkreuz */
    #nudge-pad {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(24, 24, 27, 0.9);
      border: 1px solid #52525b;
      border-radius: 12px;
      width: 120px;
      height: 120px;
      backdrop-filter: blur(4px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 4px;
      gap: 3px;
      z-index: 10;
    }
    .nudge-btn {
      background: #3f3f46;
      color: white;
      border: none;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      padding: 0;
      cursor: pointer;
    }
    .nudge-btn:active { background: #60a5fa; }
    .nudge-step-btn {
      background: #27272a;
      border: 1px solid #60a5fa;
      color: #60a5fa;
      font-weight: bold;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }

    table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 6px; }
    th, td { border: 1px solid #3f3f46; padding: 4px; text-align: right; }
    th { background: #27272a; }

    @media (max-width: 800px) {
      #main-container { flex-direction: column; }
      #sidebar { width: 100%; height: 230px; border-left: none; border-top: 1px solid #3f3f46; }
      #nudge-pad { bottom: 10px; left: 10px; width: 105px; height: 105px; }
    }
  </style>
</head>
<body>

  <header>
    <label class="btn" for="fileInput">📁 Bild</label>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    
    <button id="modeAlignBtn" onclick="setMode('align')">📐 1. Ausrichten</button>
    <button id="modeCalibBtn" onclick="setMode('calib')">🎯 2. Kalibrieren</button>
    <button id="modeDataBtn" onclick="setMode('data')">📈 3. Punkte</button>
    
    <button id="btnWarp" style="background:#10b981;" onclick="applyPerspectiveWarp()">Geraderücken</button>
    
    <div class="zoom-controls">
      <button onclick="changeZoom(-0.25)">🔍-</button>
      <span id="zoomLabel">Fit</span>
      <button onclick="changeZoom(0.25)">🔍+</button>
      <button onclick="resetZoom()">100%</button>
    </div>

    <button id="btnExport" style="background:#8b5cf6;" onclick="exportCSV()">CSV</button>
  </header>

  <div id="main-container">
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
      
      <div id="nudge-pad">
        <div></div>
        <button class="nudge-btn" onclick="nudge(0, -1)">▲</button>
        <div></div>
        <button class="nudge-btn" onclick="nudge(-1, 0)">◀</button>
        <button class="nudge-step-btn" id="stepToggleBtn" onclick="toggleStepSize()">1px</button>
        <button class="nudge-btn" onclick="nudge(1, 0)">▶</button>
        <div></div>
        <button class="nudge-btn" onclick="nudge(0, 1)">▼</button>
        <div></div>
      </div>
    </div>

    <div id="sidebar">
      <div class="panel">
        <h3 id="panel-title">Modus: 1. Ausrichten</h3>
        <p class="status-msg" id="status-desc">Klicke 4 Ecken: Oben-Links (P1), Oben-Rechts (P2), Unten-Rechts (P3), Unten-Links (P4).</p>
      </div>

      <div class="panel">
        <h3>Kalibrierwerte</h3>
        <div class="input-grid">
          <div class="input-group">
            <label>X-Min</label>
            <input type="number" id="xMinVal" value="0">
          </div>
          <div class="input-group">
            <label>X-Max</label>
            <input type="number" id="xMaxVal" value="100">
          </div>
          <div class="input-group">
            <label>Y-Min</label>
            <input type="number" id="yMinVal" value="0">
          </div>
          <div class="input-group">
            <label>Y-Max</label>
            <input type="number" id="yMaxVal" value="10">
          </div>
        </div>
      </div>

      <div class="panel" style="flex:1; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3>Datenpunkte</h3>
          <button style="background:#ef4444; padding:2px 6px; font-size:11px;" onclick="clearDataPoints()">Leeren</button>
        </div>
        <table id="dataTable">
          <thead>
            <tr><th>#</th><th>X</th><th>Y</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const fileInput = document.getElementById('fileInput');

    let imgElement = new Image();
    let currentMode = 'align';
    let activePointRef = null;
    let stepSize = 1; // 1px oder 10px
    let currentZoom = 1.0;
    let isFitToScreen = true;

    // 4 Ecken fürs Entzerren [P1, P2, P3, P4]
    let alignCorners = [];
    let alignStep = 0;

    // Kalibrier-Punkte: { x1, x2, y1, y2 }
    let calibPoints = { x1: null, x2: null, y1: null, y2: null };
    let calibStep = 0;
    let dataPoints = [];

    const MAX_DIMENSION = 1600;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const tempImg = new Image();
        tempImg.onload = () => {
          let w = tempImg.width;
          let h = tempImg.height;

          if (w > MAX_DIMENSION || h > MAX_DIMENSION) {
            const scale = Math.min(MAX_DIMENSION / w, MAX_DIMENSION / h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }

          const offCanvas = document.createElement('canvas');
          offCanvas.width = w;
          offCanvas.height = h;
          offCanvas.getContext('2d').drawImage(tempImg, 0, 0, w, h);

          imgElement = new Image();
          imgElement.onload = () => {
            canvas.width = w;
            canvas.height = h;
            alignCorners = [];
            alignStep = 0;
            calibPoints = { x1: null, x2: null, y1: null, y2: null };
            dataPoints = [];
            updateTable();
            setMode('align');
            fitToScreen();
          };
          imgElement.src = offCanvas.toDataURL('image/jpeg', 0.92);
        };
        tempImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Zoom-Funktionen
    function updateCanvasSize() {
      if (!imgElement.src) return;
      if (isFitToScreen) {
        const cWidth = container.clientWidth - 20;
        const cHeight = container.clientHeight - 20;
        const scale = Math.min(cWidth / imgElement.width, cHeight / imgElement.height);
        canvas.style.width = `${Math.round(imgElement.width * scale)}px`;
        canvas.style.height = `${Math.round(imgElement.height * scale)}px`;
        document.getElementById('zoomLabel').innerText = 'Fit';
      } else {
        canvas.style.width = `${Math.round(imgElement.width * currentZoom)}px`;
        canvas.style.height = `${Math.round(imgElement.height * currentZoom)}px`;
        document.getElementById('zoomLabel').innerText = `${Math.round(currentZoom * 100)}%`;
      }
      redraw();
    }

    function fitToScreen() {
      isFitToScreen = true;
      updateCanvasSize();
    }

    function changeZoom(delta) {
      if (isFitToScreen) {
        currentZoom = parseFloat((canvas.clientWidth / imgElement.width).toFixed(2));
        isFitToScreen = false;
      }
      currentZoom = Math.min(Math.max(0.25, currentZoom + delta), 4.0);
      updateCanvasSize();
    }

    function resetZoom() {
      isFitToScreen = false;
      currentZoom = 1.0;
      updateCanvasSize();
    }

    window.addEventListener('resize', () => {
      if (isFitToScreen) updateCanvasSize();
    });

    // Modus Umschaltung
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeAlignBtn').classList.toggle('active-mode', mode === 'align');
      document.getElementById('modeCalibBtn').classList.toggle('active-mode', mode === 'calib');
      document.getElementById('modeDataBtn').classList.toggle('active-mode', mode === 'data');

      const title = document.getElementById('panel-title');
      const desc = document.getElementById('status-desc');

      if (mode === 'align') {
        title.innerText = 'Modus: 1. Ausrichten';
        desc.innerText = 'Klicke nacheinander auf: P1 (Oben-Links), P2 (Oben-Rechts), P3 (Unten-Rechts), P4 (Unten-Links).';
      } else if (mode === 'calib') {
        title.innerText = 'Modus: 2. Kalibrieren';
        calibStep = 0;
        desc.innerText = 'Klicke nacheinander: 1. X-Min, 2. X-Max, 3. Y-Min, 4. Y-Max.';
      } else if (mode === 'data') {
        title.innerText = 'Modus: 3. Datenpunkte';
        desc.innerText = 'Klicke Datenpunkte an. Justiere mit Pfeilkreuz oder Tastatur-Pfeilen.';
      }
      redraw();
    }

    // Step-Size Toggle
    window.toggleStepSize = function() {
      stepSize = (stepSize === 1) ? 10 : 1;
      document.getElementById('stepToggleBtn').innerText = `${stepSize}px`;
    };

    // Tastatursteuerung
    window.addEventListener('keydown', (e) => {
      if (!activePointRef) return;
      let mult = e.shiftKey ? 10 : stepSize;

      if (e.key === 'ArrowUp') { nudge(0, -1, mult); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { nudge(0, 1, mult); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { nudge(-1, 0, mult); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { nudge(1, 0, mult); e.preventDefault(); }
    });

    // Pointer Interaktion
    canvas.addEventListener('pointerdown', (e) => {
      if (!imgElement.src) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      const pt = { x, y };

      if (currentMode === 'align') {
        // Bestehenden Punkt auswählen, falls nah geklickt
        let closest = null;
        let minDist = 30 * scaleX;
        alignCorners.forEach(c => {
          const d = Math.hypot(c.x - x, c.y - y);
          if (d < minDist) { minDist = d; closest = c; }
        });

        if (closest) {
          activePointRef = closest;
        } else if (alignCorners.length < 4) {
          alignCorners.push(pt);
          activePointRef = pt;
          const names = ['P2 (Oben-Rechts)', 'P3 (Unten-Rechts)', 'P4 (Unten-Links)', 'Ausrichtung komplett'];
          document.getElementById('status-desc').innerText = `Gesetzt! Als Nächstes: ${names[alignCorners.length - 1]}`;
        } else {
          // Alle 4 existieren bereits -> Ersetze nächsten Punkt
          let closestAny = alignCorners[0];
          let dMin = Math.hypot(alignCorners[0].x - x, alignCorners[0].y - y);
          for (let i = 1; i < 4; i++) {
            const d = Math.hypot(alignCorners[i].x - x, alignCorners[i].y - y);
            if (d < dMin) { dMin = d; closestAny = alignCorners[i]; }
          }
          closestAny.x = x;
          closestAny.y = y;
          activePointRef = closestAny;
        }
      } 
      else if (currentMode === 'calib') {
        activePointRef = pt;
        if (calibStep === 0) {
          calibPoints.x1 = pt; calibStep = 1;
          document.getElementById('status-desc').innerText = 'Klicke auf X-Max.';
        } else if (calibStep === 1) {
          calibPoints.x2 = pt; calibStep = 2;
          document.getElementById('status-desc').innerText = 'Klicke auf Y-Min.';
        } else if (calibStep === 2) {
          calibPoints.y1 = pt; calibStep = 3;
          document.getElementById('status-desc').innerText = 'Klicke auf Y-Max.';
        } else if (calibStep === 3) {
          calibPoints.y2 = pt; calibStep = 0;
          document.getElementById('status-desc').innerText = 'Kalibrierung beendet! Wechsle zu "3. Punkte".';
        }
      } 
      else if (currentMode === 'data') {
        dataPoints.push(pt);
        activePointRef = pt;
        updateTable();
      }

      redraw();
    });

    // Steuerkreuz Aktion
    window.nudge = function(dx, dy, customStep) {
      if (!activePointRef) return;
      const s = customStep || stepSize;
      activePointRef.x += dx * s;
      activePointRef.y += dy * s;
      redraw();
      if (currentMode === 'data') updateTable();
    };

    function redraw() {
      if (!imgElement.src) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(imgElement, 0, 0);

      // Ecken zeichnen
      if (currentMode === 'align' && alignCorners.length > 0) {
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(alignCorners[0].x, alignCorners[0].y);
        for (let i = 1; i < alignCorners.length; i++) ctx.lineTo(alignCorners[i].x, alignCorners[i].y);
        if (alignCorners.length === 4) ctx.closePath();
        ctx.stroke();

        alignCorners.forEach((c, idx) => {
          drawMarker(c, '#f59e0b', `P${idx+1}`, c === activePointRef);
        });
      }

      // Kalibrier-Punkte
      if (calibPoints.x1) drawMarker(calibPoints.x1, '#3b82f6', 'X-Min', calibPoints.x1 === activePointRef);
      if (calibPoints.x2) drawMarker(calibPoints.x2, '#3b82f6', 'X-Max', calibPoints.x2 === activePointRef);
      if (calibPoints.y1) drawMarker(calibPoints.y1, '#10b981', 'Y-Min', calibPoints.y1 === activePointRef);
      if (calibPoints.y2) drawMarker(calibPoints.y2, '#10b981', 'Y-Max', calibPoints.y2 === activePointRef);

      // Datenpunkte
      dataPoints.forEach((p, idx) => {
        drawMarker(p, '#ef4444', `${idx+1}`, p === activePointRef);
      });
    }

    function drawMarker(pt, color, label, isActive) {
      ctx.strokeStyle = isActive ? '#ffffff' : color;
      ctx.fillStyle = color;
      ctx.lineWidth = isActive ? 3 : 2;

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, isActive ? 7 : 5, 0, 2 * Math.PI);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pt.x - 10, pt.y); ctx.lineTo(pt.x + 10, pt.y);
      ctx.moveTo(pt.x, pt.y - 10); ctx.lineTo(pt.x, pt.y + 10);
      ctx.stroke();

      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(label, pt.x + 8, pt.y - 8);
    }

    // Hardware-beschleunigtes Entzerren
    function applyPerspectiveWarp() {
      if (alignCorners.length < 4 || !imgElement.src) {
        alert('Bitte zuerst alle 4 Ecken P1 bis P4 setzen!');
        return;
      }

      const [p0, p1, p2, p3] = alignCorners; // TL, TR, BR, BL
      const w = Math.round(Math.max(Math.hypot(p1.x - p0.x, p1.y - p0.y), Math.hypot(p2.x - p3.x, p2.y - p3.y)));
      const h = Math.round(Math.max(Math.hypot(p3.x - p0.x, p3.y - p0.y), Math.hypot(p2.x - p1.x, p2.y - p1.y)));

      const offCanvas = document.createElement('canvas');
      offCanvas.width = w;
      offCanvas.height = h;
      const offCtx = offCanvas.getContext('2d');

      function mapTriangle(srcTri, dstTri) {
        offCtx.save();
        offCtx.beginPath();
        offCtx.moveTo(dstTri[0].x, dstTri[0].y);
        offCtx.lineTo(dstTri[1].x, dstTri[1].y);
        offCtx.lineTo(dstTri[2].x, dstTri[2].y);
        offCtx.closePath();
        offCtx.clip();

        const x0 = srcTri[0].x, y0 = srcTri[0].y;
        const x1 = srcTri[1].x, y1 = srcTri[1].y;
        const x2 = srcTri[2].x, y2 = srcTri[2].y;
        const u0 = dstTri[0].x, v0 = dstTri[0].y;
        const u1 = dstTri[1].x, v1 = dstTri[1].y;
        const u2 = dstTri[2].x, v2 = dstTri[2].y;

        const delta = u0 * (v1 - v2) - u1 * (v0 - v2) + u2 * (v0 - v1);
        if (delta === 0) { offCtx.restore(); return; }

        const a = (x0 * (v1 - v2) - x1 * (v0 - v2) + x2 * (v0 - v1)) / delta;
        const b = (u0 * (x1 - x2) - u1 * (x0 - x2) + u2 * (x0 - x1)) / delta;
        const c = x0 - a * u0 - b * v0;

        const d = (y0 * (v1 - v2) - y1 * (v0 - v2) + y2 * (v0 - v1)) / delta;
        const e = (u0 * (y1 - y2) - u1 * (y0 - y2) + u2 * (y0 - y1)) / delta;
        const f = y0 - d * u0 - e * v0;

        const det = a * e - b * d;
        if (det === 0) { offCtx.restore(); return; }

        offCtx.transform(e / det, -d / det, -b / det, a / det, (b * f - c * e) / det, (c * d - a * f) / det);
        offCtx.drawImage(imgElement, 0, 0);
        offCtx.restore();
      }

      mapTriangle([p0, p1, p3], [{ x: 0, y: 0 }, { x: w, y: 0 }, { x: 0, y: h }]);
      mapTriangle([p1, p2, p3], [{ x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }]);

      const warpedImg = new Image();
      warpedImg.onload = () => {
        imgElement = warpedImg;
        canvas.width = warpedImg.width;
        canvas.height = warpedImg.height;
        alignCorners = [];
        setMode('calib');
        fitToScreen();
      };
      warpedImg.src = offCanvas.toDataURL('image/jpeg', 0.95);
    }

    function calculateCoords(pt) {
      if (!calibPoints.x1 || !calibPoints.x2 || !calibPoints.y1 || !calibPoints.y2) return { x: '–', y: '–' };

      const xMin = parseFloat(document.getElementById('xMinVal').value);
      const xMax = parseFloat(document.getElementById('xMaxVal').value);
      const yMin = parseFloat(document.getElementById('yMinVal').value);
      const yMax = parseFloat(document.getElementById('yMaxVal').value);

      const realX = xMin + ((pt.x - calibPoints.x1.x) / (calibPoints.x2.x - calibPoints.x1.x)) * (xMax - xMin);
      const realY = yMin + ((pt.y - calibPoints.y1.y) / (calibPoints.y2.y - calibPoints.y1.y)) * (yMax - yMin);

      return { x: realX.toFixed(3), y: realY.toFixed(3) };
    }

    function updateTable() {
      const tbody = document.querySelector('#dataTable tbody');
      tbody.innerHTML = '';
      dataPoints.forEach((pt, i) => {
        const val = calculateCoords(pt);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i + 1}</td><td>${val.x}</td><td>${val.y}</td>`;
        tbody.appendChild(tr);
      });
    }

    function clearDataPoints() {
      dataPoints = [];
      activePointRef = null;
      updateTable();
      redraw();
    }

    function exportCSV() {
      if (dataPoints.length === 0) return;
      let csv = 'Punkt,X,Y\n';
      dataPoints.forEach((pt, i) => {
        const val = calculateCoords(pt);
        csv += `${i + 1},${val.x},${val.y}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'diagramm_daten.csv';
      link.click();
    }
  </script>
</body>
</html>
